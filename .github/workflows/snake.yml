name: Generate Snake Contribution Graph

on:
  # 每天定时运行，保持蛇动画与最新贡献同步
  schedule:
    - cron: "0 0 * * *"
  # 推送到默认分支时运行
  push:
    branches:
      - main
  # 支持在 Actions 页面手动触发
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake game from contribution graph
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/github-contribution-grid-snake.gif?color_snake=orange&color_dots=#bfd0d6,#3b8c40,#2a6b2f,#1d4d22,#0f2912

      - name: Push generated files to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
